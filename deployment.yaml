apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-hub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-agent-hub
  template:
    metadata:
      labels:
        app: ai-agent-hub
    spec:
      containers:
        - name: ai-agent-hub
          image: ai-agent-hub:16
          imagePullPolicy: Never
          ports:
            - containerPort: 8081

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
