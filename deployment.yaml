apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-hub
spec:
  replicas: 3

  selector:
    matchLabels:
      app: ai-agent-hub

  template:
    metadata:
      labels:
        app: ai-agent-hub

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      containers:
        - name: ai-agent-hub
          image: 765222504001.dkr.ecr.us-east-1.amazonaws.com/ai-agent-hub:17
          imagePullPolicy: Always

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: ai-agent-hub-config
            - secretRef:
                name: ai-agent-hub-secret

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-hub-service

spec:
  type: NodePort

  selector:
    app: ai-agent-hub

  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
